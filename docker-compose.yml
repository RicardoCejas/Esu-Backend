services:
  mysql:
    image: mysql:8.0
    container_name: esu-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_esu
    ports:
      - "3306:3306"
    volumes:
      - esu_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: esu-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/db_esu?createDatabaseIfNotExist=true&serverTimezone=America/Argentina/Cordoba
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: root
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  esu_mysql_data:
