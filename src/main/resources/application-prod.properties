# =============================================================================
# Propiedades obligatorias para entorno de producción (Perfil 'prod')
# =============================================================================

# Base de datos y persistencia estricta
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Secretos obligatorios sin fallbacks débiles
app.jwt.secret=${APP_JWT_SECRET:}
app.documentos.firma-secret=${APP_DOCUMENTOS_FIRMA_SECRET:}

# Sesión y Cookies Seguras (DoD HU-12)
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Desactivar semillas demo y herramientas de testing en producción
app.demo.seed-accounts=false
esu.dev.secret=

# Desactivar Swagger / OpenAPI en entorno productivo
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Observabilidad Actuator cerrada y autorizada
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=false
