spring.application.name=Esu

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/db_esu?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.user.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Booking windows are wall-clock times in the clinic zone; closures/holidays are not modeled.
esu.turnos.zone=America/Argentina/Cordoba
esu.turnos.slot-minutes=30
esu.turnos.open=08:00
esu.turnos.close=17:00

# Carga de archivos y adjuntos medicos (HU-101 / HU-73)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
esu.uploads.estudios.dir=uploads/estudios
