spring.application.name=Esu

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/db_esu?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.user.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# HU / Issue #117: seguridad JWT y CORS
# El secret es obligatorio (sin valor por defecto) para evitar tokens forjables.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Lista de orígenes permitidos por CORS (separados por coma). Nunca "*" con credenciales.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Documentación interactiva sólo habilitada en desarrollo por defecto.
app.security.swagger-public=${SWAGGER_PUBLIC:true}
