spring.application.name=Esu



server.port=${SERVER_PORT:8080}



spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/db_esu?createDatabaseIfNotExist=true&serverTimezone=UTC}

spring.datasource.username=${MYSQL_USERNAME:root}

spring.datasource.password=${MYSQL_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.properties.hibernate.format_sql=true



# =============================================================================

# HU-97: Configuracion SMTP para Notificaciones Automatizadas (Spring Mail)

# =============================================================================

spring.mail.host=${SMTP_HOST:smtp.gmail.com}

spring.mail.port=${SMTP_PORT:587}

spring.mail.username=${SMTP_USERNAME:notificaciones@esu.cruzdeleje.gob.ar}

spring.mail.password=${SMTP_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true

spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000

spring.mail.properties.mail.smtp.timeout=5000

spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_FROM:notificaciones@esu.cruzdeleje.gob.ar}

app.frontend.url=${FRONTEND_URL:http://localhost:5173}



# Booking windows are wall-clock times in the clinic zone; closures/holidays are not modeled.

esu.turnos.zone=America/Argentina/Cordoba

esu.turnos.slot-minutes=30

esu.turnos.open=08:00

esu.turnos.close=17:00



# Carga de archivos y adjuntos medicos (HU-101 / HU-73)

spring.servlet.multipart.max-file-size=15MB

spring.servlet.multipart.max-request-size=15MB

esu.uploads.estudios.dir=uploads/estudios



# Migraciones de esquema Flyway

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}

spring.flyway.baseline-on-migrate=true


# =============================================================================
# Observabilidad y Salud con Spring Boot Actuator
# =============================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# =============================================================================
# Optimizacion de Pool de Conexiones HikariCP
# =============================================================================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# =============================================================================
# Cache en Memoria para Catalogos Medicos
# =============================================================================
spring.cache.type=simple


# =============================================================================
# Compresion de Respuestas HTTP GZIP (HU-141)
# =============================================================================
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
server.compression.min-response-size=1024
