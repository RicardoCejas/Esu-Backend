spring.application.name=Esu
server.port=8080
spring.datasource.url=jdbc:h2:mem:db_esu;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
app.jwt.secret=TestSecretAtLeast32CharactersLongForEsuTests2026!
app.jwt.expiration-ms=86400000
app.frontend.url=http://localhost:5173
esu.turnos.zone=America/Argentina/Cordoba
esu.turnos.slot-minutes=30
esu.turnos.open=08:00
esu.turnos.close=17:00
spring.flyway.enabled=false
